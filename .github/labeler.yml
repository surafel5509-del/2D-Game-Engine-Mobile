# Labeler configuration
# See: https://github.com/actions/labeler

# Physics-related changes
physics:
  - changed-files:
      - any-glob-to-any-file:
          - 'app/src/main/java/com/sengine/engine/physics/**'

# Rendering-related changes
rendering:
  - changed-files:
      - any-glob-to-any-file:
          - 'app/src/main/java/com/sengine/engine/render/**'

# Animation-related changes
animation:
  - changed-files:
      - any-glob-to-any-file:
          - 'app/src/main/java/com/sengine/engine/animation/**'

# Scripting system changes
scripting:
  - changed-files:
      - any-glob-to-any-file:
          - 'app/src/main/java/com/sengine/engine/script/**'

# UI-related changes
ui:
  - changed-files:
      - any-glob-to-any-file:
          - 'app/src/main/java/com/sengine/ui/**'
          - 'app/src/main/java/com/sengine/engine/ui/**'

# Core engine changes
core:
  - changed-files:
      - any-glob-to-any-file:
          - 'app/src/main/java/com/sengine/engine/core/**'
          - 'app/src/main/java/com/sengine/engine/Engine.kt'

# Documentation changes
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - 'docs/**'

# Build system changes
build:
  - changed-files:
      - any-glob-to-any-file:
          - 'build.gradle*'
          - 'app/build.gradle*'
          - 'settings.gradle*'
          - 'gradle.properties'
          - 'gradle/**'
          - 'gradlew*'

# CI/CD changes
ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**'
          - '.github/labeler.yml'

# Resource/asset management
resources:
  - changed-files:
      - any-glob-to-any-file:
          - 'app/src/main/java/com/sengine/engine/resource/**'

# Save/load system
save-system:
  - changed-files:
      - any-glob-to-any-file:
          - 'app/src/main/java/com/sengine/engine/save/**'

# Debug tools
debug:
  - changed-files:
      - any-glob-to-any-file:
          - 'app/src/main/java/com/sengine/engine/debug/**'

# Test changes
tests:
  - changed-files:
      - any-glob-to-any-file:
          - 'app/src/test/**'
          - '**/*Test.kt'

# Templates
templates:
  - changed-files:
      - any-glob-to-any-file:
          - 'app/src/main/java/com/sengine/project/Templates.kt'

# Math utilities
math:
  - changed-files:
      - any-glob-to-any-file:
          - 'app/src/main/java/com/sengine/engine/math/**'

# Audio system
audio:
  - changed-files:
      - any-glob-to-any-file:
          - 'app/src/main/java/com/sengine/engine/AudioSystem.kt'

# Input system
input:
  - changed-files:
      - any-glob-to-any-file:
          - 'app/src/main/java/com/sengine/engine/Input.kt'

# Project management
project:
  - changed-files:
      - any-glob-to-any-file:
          - 'app/src/main/java/com/sengine/project/**'

# Android resources
android-resources:
  - changed-files:
      - any-glob-to-any-file:
          - 'app/src/main/res/**'
          - 'app/src/main/AndroidManifest.xml'
