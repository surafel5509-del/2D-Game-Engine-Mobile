name: Build & Verify Debug APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  build-and-verify:
    name: Build & Verify Debug APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run Unit Tests
        run: ./gradlew test --no-daemon

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon
          echo "✅ Debug APK built successfully"
          
          # Move APK to workspace root for easier access
          cp app/build/outputs/apk/debug/app-debug.apk ./sengine-debug.apk
          echo "APK_PATH=./sengine-debug.apk" >> $GITHUB_ENV

      - name: Install Android SDK Build Tools
        run: |
          echo "Installing Android SDK build tools..."
          mkdir -p $ANDROID_HOME/build-tools
          
          # Use sdkmanager to install build tools
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "build-tools;34.0.0" || {
            echo "Trying alternative installation..."
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "build-tools;34.0.0"
          }
          
          # Add to PATH
          BUILD_TOOLS_PATH=$(find $ANDROID_HOME/build-tools -name "aapt2" -type f | head -1 | xargs dirname)
          echo "Build tools path: $BUILD_TOOLS_PATH"
          echo "$BUILD_TOOLS_PATH" >> $GITHUB_PATH
          
          # Verify installation
          ls -la $BUILD_TOOLS_PATH/

      - name: Verify APK Signature
        run: |
          echo "🔐 Verifying APK signature..."
          
          APK_FILE="sengine-debug.apk"
          
          # Check if apksigner is available
          if command -v apksigner &> /dev/null; then
            echo "Using apksigner..."
            apksigner verify --print-certs $APK_FILE
            echo "✅ APK signature is valid"
          elif command -v jarsigner &> /dev/null; then
            echo "Using jarsigner (fallback)..."
            jarsigner -verify -verbose -certs $APK_FILE
            echo "✅ APK signature is valid (verified with jarsigner)"
          else
            echo "⚠️  No signature verification tool found, checking APK structure instead..."
          fi
          
          # Also verify with unzip (APK is a ZIP file)
          unzip -t $APK_FILE > /dev/null
          echo "✅ APK archive structure is valid"

      - name: Analyze APK Manifest
        run: |
          echo "📋 Analyzing Android Manifest..."
          
          APK_FILE="sengine-debug.apk"
          
          # Extract and analyze AndroidManifest.xml
          mkdir -p apk-analysis
          cd apk-analysis
          
          # Use aapt to dump manifest (if available)
          if command -v aapt &> /dev/null; then
            echo "Using aapt..."
            aapt dump badging $APK_FILE > manifest-dump.txt
            aapt dump xmltree $APK_FILE AndroidManifest.xml > manifest-tree.txt
          elif command -v aapt2 &> /dev/null; then
            echo "Using aapt2..."
            aapt2 dump badging $APK_FILE > manifest-dump.txt
          else
            echo "⚠️  aapt not found, extracting manifest manually..."
            unzip -q $APK_FILE AndroidManifest.xml
          fi
          
          cd ..
          
          # Parse key information
          echo "### APK Manifest Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f apk-analysis/manifest-dump.txt ]; then
            # Extract package name
            PACKAGE=$(grep "package:" apk-analysis/manifest-dump.txt | head -1 | sed "s/package: '\([^']*\)'.*/\1/")
            echo "**Package Name:** $PACKAGE" >> $GITHUB_STEP_SUMMARY
            
            # Extract version
            VERSION_NAME=$(grep "versionName" apk-analysis/manifest-dump.txt | head -1 | sed "s/.*versionName='\([^']*\)'.*/\1/")
            VERSION_CODE=$(grep "versionCode" apk-analysis/manifest-dump.txt | head -1 | sed "s/.*versionCode='\([^']*\)'.*/\1/")
            echo "**Version:** $VERSION_NAME (Code: $VERSION_CODE)" >> $GITHUB_STEP_SUMMARY
            
            # Extract min/target SDK
            MIN_SDK=$(grep "sdkVersion" apk-analysis/manifest-dump.txt | head -1 | sed "s/sdkVersion:'\([^']*\)'.*/\1/")
            TARGET_SDK=$(grep "targetSdkVersion" apk-analysis/manifest-dump.txt | head -1 | sed "s/targetSdkVersion:'\([^']*\)'.*/\1/")
            echo "**Min SDK:** $MIN_SDK" >> $GITHUB_STEP_SUMMARY
            echo "**Target SDK:** $TARGET_SDK" >> $GITHUB_STEP_SUMMARY
            
            # Extract permissions
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Permissions:**" >> $GITHUB_STEP_SUMMARY
            grep "uses-permission" apk-analysis/manifest-dump.txt | sed "s/.*name='\([^']*\)'.*/- \`\1\`/" >> $GITHUB_STEP_SUMMARY || echo "- None" >> $GITHUB_STEP_SUMMARY
            
            # Extract activities
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Activities:**" >> $GITHUB_STEP_SUMMARY
            grep "launchable-activity" apk-analysis/manifest-dump.txt | sed "s/.*name='\([^']*\)'.*/- \`\1\`/" >> $GITHUB_STEP_SUMMARY || echo "- None found" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️  Could not parse manifest details" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Analyze APK Structure
        run: |
          echo "📦 Analyzing APK structure..."
          
          APK_FILE="sengine-debug.apk"
          
          # Create analysis directory
          mkdir -p apk-contents
          cd apk-contents
          
          # Extract APK contents
          unzip -q $APK_FILE
          
          # Count files by type
          echo "### APK Contents Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          DEX_COUNT=$(find . -name "*.dex" | wc -l)
          SO_COUNT=$(find . -name "*.so" | wc -l)
          RES_COUNT=$(find res -type f 2>/dev/null | wc -l || echo "0")
          ASSET_COUNT=$(find assets -type f 2>/dev/null | wc -l || echo "0")
          
          echo "**DEX Files:** $DEX_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "**Native Libraries (.so):** $SO_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "**Resources:** $RES_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "**Assets:** $ASSET_COUNT" >> $GITHUB_STEP_SUMMARY
          
          # Check for required files
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Required Files Check:**" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "AndroidManifest.xml" ]; then
            echo "- ✅ AndroidManifest.xml" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ AndroidManifest.xml (MISSING)" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          
          if [ -f "classes.dex" ]; then
            echo "- ✅ classes.dex" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ classes.dex (MISSING)" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          
          if [ -d "res" ]; then
            echo "- ✅ res/ directory" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ⚠️  res/ directory (not found, may be OK for minimal apps)" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Show directory structure
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Top-level directories:**" >> $GITHUB_STEP_SUMMARY
          ls -la | grep "^d" | awk '{print "- `" $9 "`"}' >> $GITHUB_STEP_SUMMARY
          
          # Show largest files
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Top 10 largest files:**" >> $GITHUB_STEP_SUMMARY
          find . -type f -exec du -h {} + | sort -rh | head -10 | awk '{print "- `" $2 "` (" $1 ")"}' >> $GITHUB_STEP_SUMMARY
          
          cd ..

      - name: Check APK Size
        run: |
          echo "📏 Checking APK size..."
          
          APK_FILE="sengine-debug.apk"
          
          # Get file size in bytes and MB
          SIZE_BYTES=$(stat -c%s "$APK_FILE" 2>/dev/null || stat -f%z "$APK_FILE")
          SIZE_MB=$(echo "scale=2; $SIZE_BYTES / 1048576" | bc)
          
          echo "### APK Size" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Size:** $SIZE_MB MB ($SIZE_BYTES bytes)" >> $GITHUB_STEP_SUMMARY
          
          # Check if size is reasonable (warning if > 50MB, error if > 100MB)
          if [ $SIZE_BYTES -gt 104857600 ]; then
            echo "❌ **ERROR:** APK size exceeds 100MB!" >> $GITHUB_STEP_SUMMARY
            exit 1
          elif [ $SIZE_BYTES -gt 52428800 ]; then
            echo "⚠️  **WARNING:** APK size exceeds 50MB. Consider optimizing assets." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ APK size is within acceptable limits." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Validate APK Installability
        run: |
          echo "🔍 Validating APK installability..."
          
          APK_FILE="sengine-debug.apk"
          
          # Check if aapt is available for validation
          if command -v aapt &> /dev/null; then
            echo "Validating with aapt..."
            
            # Check for required attributes
            if aapt dump badging $APK_FILE | grep -q "package: name="; then
              echo "✅ Package name is defined"
            else
              echo "❌ Package name is missing"
              exit 1
            fi
            
            if aapt dump badging $APK_FILE | grep -q "application-label"; then
              echo "✅ Application label is defined"
            else
              echo "⚠️  Application label might be missing"
            fi
            
            if aapt dump badging $APK_FILE | grep -q "launchable-activity"; then
              echo "✅ At least one launchable activity found"
            else
              echo "❌ No launchable activity found"
              exit 1
            fi
            
          else
            echo "⚠️  aapt not available, performing basic validation..."
            
            # Basic validation using unzip
            if unzip -l $APK_FILE | grep -q "AndroidManifest.xml"; then
              echo "✅ AndroidManifest.xml present"
            else
              echo "❌ AndroidManifest.xml missing"
              exit 1
            fi
            
            if unzip -l $APK_FILE | grep -q "classes.dex"; then
              echo "✅ classes.dex present"
            else
              echo "❌ classes.dex missing"
              exit 1
            fi
          fi
          
          echo "✅ APK appears to be installable"

      - name: Generate Build Report
        if: always()
        run: |
          echo "## 🔧 Debug APK Build Report" > build-report.md
          echo "" >> build-report.md
          echo "**Build Status:** $([ ${{ job.status }} == 'success' ] && echo '✅ Success' || echo '❌ Failed')" >> build-report.md
          echo "**Build Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> build-report.md
          echo "**Commit:** ${{ github.sha }}" >> build-report.md
          echo "**Branch:** ${{ github.ref_name }}" >> build-report.md
          echo "" >> build-report.md
          
          if [ -f sengine-debug.apk ]; then
            SIZE_MB=$(echo "scale=2; $(stat -c%s sengine-debug.apk 2>/dev/null || stat -f%z sengine-debug.apk) / 1048576" | bc)
            echo "### APK Details" >> build-report.md
            echo "- **File:** sengine-debug.apk" >> build-report.md
            echo "- **Size:** $SIZE_MB MB" >> build-report.md
            echo "- **Type:** Debug Build" >> build-report.md
            echo "" >> build-report.md
          fi
          
          cat build-report.md >> $GITHUB_STEP_SUMMARY

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sengine-debug-apk
          path: sengine-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Analysis Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-analysis-reports
          path: |
            apk-analysis/
            build-report.md
          retention-days: 14
          if-no-files-found: warn

      - name: Comment on PR
        if: github.event_name == 'pull_request' && success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            
            let apkSize = 'Unknown';
            try {
              const stats = fs.statSync('sengine-debug.apk');
              apkSize = (stats.size / 1048576).toFixed(2) + ' MB';
            } catch (e) {
              console.log('Could not read APK size');
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ✅ Debug APK Built Successfully!
              
              **Build Details:**
              - 📦 APK Size: ${apkSize}
              - 🔐 Signature: Valid
              - 📋 Manifest: Valid
              - 📁 Structure: Valid
              - ✅ Installability: Verified
              
              **Download:**
              The debug APK is available in the workflow artifacts. You can download it from the [Actions tab](${context.payload.repository.html_url}/actions/runs/${context.runId}).
              
              **Installation:**
              1. Download the APK from artifacts
              2. Transfer to your Android device
              3. Enable "Install from Unknown Sources" in device settings
              4. Install the APK
              
              **Note:** This is a debug build signed with the debug key. It's suitable for testing but not for distribution.`
            });

      - name: Upload to Test Builds (Optional)
        if: github.ref == 'refs/heads/main' && success()
        continue-on-error: true
        run: |
          echo "📤 Uploading to test distribution service..."
          echo "Note: Configure your preferred distribution service (Firebase App Distribution, AppCenter, etc.)"
          echo "APK is available as artifact: sengine-debug-apk"
