name: Build S Engine Android APK

on:
  push:
    branches: [ main, develop, 'arena/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Validate the 100-item offline asset library
        run: python3 tools/validate_builtin_library.py

      - name: Validate the standalone game-export template
        run: python3 tools/validate_export_template.py

      - name: Run unit and engine simulation tests
        shell: bash
        run: |
          set +e
          gradle testDebugUnitTest --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/testDebugUnitTest.log"
          test_status=${PIPESTATUS[0]}
          if (( test_status != 0 )); then
            {
              echo "## Unit and engine simulation test failure"
              echo
              echo '```text'
              tail -n 90 "$RUNNER_TEMP/testDebugUnitTest.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            python3 - "$RUNNER_TEMP/testDebugUnitTest.log" <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          diagnostics = []
          reports = Path("app/build/test-results/testDebugUnitTest")
          for report in sorted(reports.glob("TEST-*.xml")) if reports.exists() else []:
              try:
                  root = ET.parse(report).getroot()
              except ET.ParseError:
                  continue
              for case in root.findall(".//testcase"):
                  for failure in list(case):
                      if failure.tag in ("failure", "error"):
                          message = failure.attrib.get("message", "")
                          trace = (failure.text or "").strip().splitlines()
                          summary = f"FAILED {case.attrib.get('classname', '')}#{case.attrib.get('name', '')}: {message}"
                          diagnostics.append(summary[:1000])
                          diagnostics.extend(line.strip()[:500] for line in trace[:3])

          log = Path(sys.argv[1]).read_text(errors="replace").splitlines()
          markers = (
              "failure: build failed", "* what went wrong:", "execution failed for task",
              "compilation error", "error:", "e: ", "failed", "there were failing tests",
              "tests failed", "caused by:",
          )
          selected = []
          for index, line in enumerate(log):
              if any(marker in line.lower() for marker in markers) and not line.lstrip().startswith("at "):
                  selected.extend(log[index:index + 2])
          for line in selected:
              if line not in diagnostics:
                  diagnostics.append(line.strip())
          details = "\n".join(diagnostics) or "\n".join(log[-25:]) or "Gradle failed without producing output."
          details = details[:3500]
          escaped = details.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Gradle test failure::{escaped}")
          PY
          fi
          exit "$test_status"

      - name: Build installable editor APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SEngine-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SEngine-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            ${{ runner.temp }}/testDebugUnitTest.log
          if-no-files-found: error
          retention-days: 14
