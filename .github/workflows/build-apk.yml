name: Build APK

on:
  push:
    branches: [ main, develop, 'arena/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Compile Kotlin
      id: compile
      run: |
        set +e
        gradle compileDebugKotlin --stacktrace > compile-output.log 2>&1
        EXIT_CODE=$?
        echo "=== COMPILATION ERRORS ==="
        grep -E "^e: |error:|Unresolved|Cannot|Expecting|Type mismatch|Overload" compile-output.log || true
        echo "=== END ERRORS ==="
        echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
        cat compile-output.log
        exit $EXIT_CODE

    - name: Build APK
      if: steps.compile.outputs.exit_code == '0'
      run: gradle assembleDebug

    - name: Upload APK
      if: steps.compile.outputs.exit_code == '0'
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: compile-output.log
