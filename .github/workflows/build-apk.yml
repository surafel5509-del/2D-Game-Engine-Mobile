name: Build S Engine Android APK

on:
  push:
    branches: [ main, develop, 'arena/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Validate the 100-item offline asset library
        run: python3 tools/validate_builtin_library.py

      - name: Validate the standalone game-export template
        run: python3 tools/validate_export_template.py

      - name: Run unit and engine simulation tests
        shell: bash
        run: |
          set +e
          gradle testDebugUnitTest --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/testDebugUnitTest.log"
          test_status=${PIPESTATUS[0]}
          if (( test_status != 0 )); then
            {
              echo "## Unit and engine simulation test failure"
              echo
              echo '```text'
              tail -n 90 "$RUNNER_TEMP/testDebugUnitTest.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            python3 - "$RUNNER_TEMP/testDebugUnitTest.log" <<'PY'
          from pathlib import Path
          import sys

          log = Path(sys.argv[1]).read_text(errors="replace").splitlines()
          details = "\n".join(log[-90:]) or "Gradle failed without producing output."
          escaped = details.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Gradle test failure::{escaped}")
          PY
          fi
          exit "$test_status"

      - name: Build installable editor APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SEngine-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SEngine-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            ${{ runner.temp }}/testDebugUnitTest.log
          if-no-files-found: error
          retention-days: 14
