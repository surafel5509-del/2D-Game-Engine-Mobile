name: Build APK

on:
  push:
    branches: [ main, develop, 'arena/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Compile Kotlin
      id: compile
      run: |
        set +e
        gradle compileDebugKotlin --stacktrace > compile-output.log 2>&1
        EXIT_CODE=$?
        # Extract errors
        echo "=== BUILD OUTPUT ===" > build-errors.txt
        grep -E "^e: |error:|Unresolved|Cannot|Expecting|Type mismatch" compile-output.log >> build-errors.txt 2>/dev/null || true
        echo "" >> build-errors.txt
        echo "=== LAST 80 LINES ===" >> build-errors.txt
        tail -80 compile-output.log >> build-errors.txt
        cat build-errors.txt
        # Write summary
        echo "## Compilation Result" >> $GITHUB_STEP_SUMMARY
        echo "Exit code: $EXIT_CODE" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        cat build-errors.txt >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        exit $EXIT_CODE

    - name: Commit build errors
      if: always()
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add build-errors.txt || true
        git commit -m "Update build errors [skip ci]" || true
        git push || true

    - name: Build APK
      if: steps.compile.outcome == 'success'
      run: gradle assembleDebug

    - name: Upload APK
      if: steps.compile.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
