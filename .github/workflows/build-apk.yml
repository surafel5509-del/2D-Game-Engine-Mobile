name: Build APK

on:
  push:
    branches: [ main, develop, 'arena/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Compile Kotlin
      id: compile
      run: |
        set +e
        gradle compileDebugKotlin --stacktrace > compile-output.log 2>&1
        EXIT_CODE=$?
        # Write errors to step summary
        echo "## Compilation Errors" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        grep -E "^e: |error:|Unresolved|Cannot|Expecting|Type mismatch|Overload|not found" compile-output.log >> $GITHUB_STEP_SUMMARY || echo "No specific errors found in grep" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        # Also print last 50 lines
        echo "## Last 50 lines of build output" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        tail -50 compile-output.log >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        exit $EXIT_CODE

    - name: Build APK
      if: steps.compile.outcome == 'success'
      run: gradle assembleDebug

    - name: Upload APK
      if: steps.compile.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: compile-output.log
