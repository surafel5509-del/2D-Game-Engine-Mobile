name: Verify APK

on:
  workflow_dispatch:
    inputs:
      apk_artifact:
        description: 'APK artifact name to download (leave empty to build fresh)'
        required: false
        default: ''
        type: string
      strict_mode:
        description: 'Fail on warnings too'
        required: false
        default: false
        type: boolean
      verbose:
        description: 'Show detailed output'
        required: false
        default: true
        type: boolean

  workflow_call:
    inputs:
      apk_artifact:
        description: 'APK artifact name to download'
        required: false
        default: ''
        type: string
      strict_mode:
        description: 'Fail on warnings too'
        required: false
        default: false
        type: boolean
      verbose:
        description: 'Show detailed output'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  checks: write

jobs:
  verify:
    name: Verify APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download APK artifact
        if: inputs.apk_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.apk_artifact }}
          path: apk-input/
      
      - name: Find APK file
        id: find_apk
        run: |
          if [[ -n "${{ inputs.apk_artifact }}" ]]; then
            APK_PATH=$(find apk-input/ -name "*.apk" -type f | head -1)
          elif [[ -f "app/build/outputs/apk/debug/app-debug.apk" ]]; then
            APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          else
            echo "No APK found, building fresh..."
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
            APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          fi
          
          if [[ -z "$APK_PATH" ]]; then
            echo "❌ Could not find APK file"
            exit 1
          fi
          
          echo "APK found at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK Build Tools
        run: |
          echo "Installing Android SDK build-tools..."
          
          # Ensure Android SDK is available
          if [[ -z "$ANDROID_HOME" ]]; then
            export ANDROID_HOME="/opt/android-sdk"
          fi
          
          # Install build-tools if needed
          if ! command -v aapt &>/dev/null && ! command -v aapt2 &>/dev/null; then
            yes | sdkmanager --install "build-tools;34.0.0" 2>/dev/null || {
              mkdir -p $ANDROID_HOME/cmdline-tools
              echo "SDK manager not available, using fallback tools"
            }
          fi
          
          # Add build-tools to PATH
          BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -name "aapt*" -type f 2>/dev/null | head -1 | xargs dirname)
          if [[ -n "$BUILD_TOOLS" ]]; then
            echo "Found build-tools at: $BUILD_TOOLS"
            echo "$BUILD_TOOLS" >> $GITHUB_PATH
          fi

      - name: Run APK Verification
        id: verify
        run: |
          APK_PATH="${{ steps.find_apk.outputs.apk_path }}"
          
          ARGS="$APK_PATH"
          [[ "${{ inputs.verbose }}" == "true" ]] && ARGS="$ARGS --verbose"
          [[ "${{ inputs.strict_mode }}" == "true" ]] && ARGS="$ARGS --strict"
          
          echo "Running verification: scripts/verify-apk.sh $ARGS"
          echo ""
          
          chmod +x scripts/verify-apk.sh
          ./scripts/verify-apk.sh $ARGS || {
            EXIT_CODE=$?
            if [[ $EXIT_CODE -eq 1 ]]; then
              echo "verification_result=FAILED" >> $GITHUB_OUTPUT
              echo "::error::APK verification FAILED"
            elif [[ $EXIT_CODE -eq 2 ]]; then
              echo "verification_result=WARNINGS" >> $GITHUB_OUTPUT
              echo "::warning::APK verification passed with warnings"
            else
              echo "verification_result=ERROR" >> $GITHUB_OUTPUT
              echo "::error::APK verification encountered an error"
            fi
            exit $EXIT_CODE
          }
          
          echo "verification_result=PASSED" >> $GITHUB_OUTPUT

      - name: Upload Verification Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-verification-report
          path: |
            *-verification-report.md
            apk-contents/
          retention-days: 14
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          echo "## APK Verification Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          RESULT="${{ steps.verify.outputs.verification_result }}"
          
          case $RESULT in
            PASSED)
              echo "✅ **Status:** PASSED" >> $GITHUB_STEP_SUMMARY
              ;;
            WARNINGS)
              echo "⚠️ **Status:** PASSED WITH WARNINGS" >> $GITHUB_STEP_SUMMARY
              ;;
            FAILED)
              echo "❌ **Status:** FAILED" >> $GITHUB_STEP_SUMMARY
              ;;
            *)
              echo "❓ **Status:** UNKNOWN" >> $GITHUB_STEP_SUMMARY
              ;;
          esac
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**APK:** ${{ steps.find_apk.outputs.apk_path }}" >> $GITHUB_STEP_SUMMARY
          
          # Include report if it exists
          REPORT=$(find . -name "*-verification-report.md" | head -1)
          if [[ -f "$REPORT" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "<details>" >> $GITHUB_STEP_SUMMARY
            echo "<summary>Full verification report</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            cat "$REPORT" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          fi
