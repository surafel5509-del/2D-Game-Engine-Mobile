name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v2.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Get version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Release version: ${VERSION}"

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Build Debug APK
        run: |
          ./gradlew --no-daemon assembleDebug

      - name: Prepare Release Assets
        run: |
          cp app/build/outputs/apk/release/app-release.apk SEngine-${{ steps.version.outputs.version }}-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk SEngine-${{ steps.version.outputs.version }}-debug.apk
          
          # Generate checksums
          sha256sum SEngine-*.apk > checksums.txt

      - name: Generate Release Notes
        id: notes
        run: |
          cat > release_notes.md << 'EOF'
          ## S Engine 2D ${{ steps.version.outputs.version }}
          
          ### 🎮 Features
          - Professional 2D physics engine with joints, raycasts, and character controllers
          - Vehicle physics with suspension and terrain interaction
          - Ragdoll physics system
          - Advanced animation system with state machine
          - TileMap and terrain systems
          - Professional UI system for in-game HUDs
          - Enhanced scripting API with physics queries and signals
          - Object pooling for performance optimization
          - Save/load system with checkpoints
          - Debug profiler and console
          
          ### 📦 Installation
          - Download the APK for your Android device
          - Enable "Install from Unknown Sources" in device settings
          - Install and launch the app
          - Requires Android 8.0+ (API 26+)
          
          ### 📚 Documentation
          See README.md for complete documentation and scripting examples.
          
          ### 🐛 Known Issues
          - Some UI elements may not scale perfectly on all screen sizes
          - Large projects may experience slower load times
          
          ---
          **Full Changelog**: https://github.com/${{ github.repository }}/compare/v1.0.0...${{ steps.version.outputs.version }}
          EOF
          
          echo "notes_file=release_notes.md" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: S Engine 2D ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            SEngine-${{ steps.version.outputs.version }}-release.apk
            SEngine-${{ steps.version.outputs.version }}-debug.apk
            checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Latest Release
        if: "!contains(steps.version.outputs.version, 'alpha') && !contains(steps.version.outputs.version, 'beta') && !contains(steps.version.outputs.version, 'rc')"
        run: |
          # Delete old latest release
          gh release delete sengine-latest --yes --cleanup-tag 2>/dev/null || true
          
          # Create new latest release
          cp SEngine-${{ steps.version.outputs.version }}-release.apk SEngine-latest.apk
          gh release create sengine-latest SEngine-latest.apk \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "S Engine 2D – Latest Build" \
            --notes "Latest stable build. Use this for general testing."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: [release]
    if: success()
    steps:
      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Discord Notification
        if: env.DISCORD_WEBHOOK != ''
        run: |
          curl -H "Content-Type: application/json" \
            -d '{
              "content": null,
              "embeds": [{
                "title": "🎮 New Release: S Engine 2D ${{ steps.version.outputs.version }}",
                "description": "A new version of S Engine 2D is now available!\n\n[Download APK](https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.version }})",
                "color": 5814783,
                "footer": {
                  "text": "2D Game Engine for Android"
                }
              }]
            }' \
            ${{ env.DISCORD_WEBHOOK }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
