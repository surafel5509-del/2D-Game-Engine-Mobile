name: Signed S Engine Release APK

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.SENGINE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SENGINE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SENGINE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SENGINE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || {
            echo 'Configure SENGINE_KEYSTORE_BASE64, SENGINE_KEYSTORE_PASSWORD, SENGINE_KEY_ALIAS and SENGINE_KEY_PASSWORD' >&2
            exit 1
          }

      - name: Restore private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SENGINE_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sengine-release.jks"

      - name: Build and test signed release
        env:
          SENGINE_KEYSTORE_PATH: ${{ runner.temp }}/sengine-release.jks
          SENGINE_KEYSTORE_PASSWORD: ${{ secrets.SENGINE_KEYSTORE_PASSWORD }}
          SENGINE_KEY_ALIAS: ${{ secrets.SENGINE_KEY_ALIAS }}
          SENGINE_KEY_PASSWORD: ${{ secrets.SENGINE_KEY_PASSWORD }}
        run: |
          gradle testDebugUnitTest assembleRelease --stacktrace

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: SEngine-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 60
