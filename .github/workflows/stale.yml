name: Stale Issues & PRs

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark Stale Items
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          # Issues
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            recent activity. It will be closed in 14 days if no further activity occurs.
            If this issue is still relevant, please leave a comment to keep it open.
            Thank you for your contributions!
          close-issue-message: >
            This issue has been automatically closed due to inactivity.
            If you believe this issue is still relevant, please reopen it or create a new one.
          stale-issue-label: 'stale'
          exempt-issue-labels: 'pinned,security,enhancement,bug'

          # PRs
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-pr-message: >
            This pull request has been automatically marked as stale because it has not had
            recent activity. It will be closed in 14 days if no further activity occurs.
            If you are still working on this PR, please leave a comment or push new commits.
          close-pr-message: >
            This pull request has been automatically closed due to inactivity.
            Feel free to reopen it if you'd like to continue working on it.
          stale-pr-label: 'stale'
          exempt-pr-labels: 'pinned,security,WIP'

          # Operations
          operations-per-run: 100
          remove-stale-when-updated: true
          ascending: true
